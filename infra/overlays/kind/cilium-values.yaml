# Cilium values for Kind cluster — VXLAN tunnel mode
# Chart: cilium/cilium

kubeProxyReplacement: true
routingMode: tunnel
tunnelProtocol: vxlan

# Required when replacing kube-proxy: Cilium must reach the API server
# directly via the control-plane node IP (not the service IP 10.96.0.1)
# The bootstrap script auto-detects and passes --set for these.
# k8sServiceHost: <auto-detected>
# k8sServicePort: 6443

ipam:
  mode: kubernetes

socketLB:
  hostNamespaceOnly: true

l2announcements:
  enabled: true

externalIPs:
  enabled: true

operator:
  replicas: 1
