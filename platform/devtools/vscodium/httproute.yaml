apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vscodium
  namespace: devtools
spec:
  parentRefs:
    - name: util-gateway
      namespace: kgateway-system
      sectionName: https
  hostnames:
    - "vscodium.util.lcl"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: vscodium
          port: 3000
