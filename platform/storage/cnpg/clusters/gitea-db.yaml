apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: gitea-db
  namespace: storage
spec:
  instances: 1
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: gitea
      owner: gitea
      secret:
        name: gitea-db-credentials
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "128MB"
---
apiVersion: v1
kind: Secret
metadata:
  name: gitea-db-credentials
  namespace: storage
type: kubernetes.io/basic-auth
stringData:
  username: gitea
  password: changeme    # Override via SealedSecret or bootstrap
