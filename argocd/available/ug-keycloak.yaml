apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ug-keycloak
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: util-gitops
    util-gitops.io/category: identity
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: ug-infra
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: keycloak
      targetRevision: "25.2.0"
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/platform/identity/keycloak/values.yaml
    - repoURL: https://gitea.util.lcl/AduraX/util-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: identity
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
