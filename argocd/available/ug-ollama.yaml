apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ug-ollama
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: util-gitops
    util-gitops.io/category: ai
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: ug-infra
  sources:
    - repoURL: https://otwld.github.io/ollama-helm/
      chart: ollama
      targetRevision: "1.81.0"
      helm:
        releaseName: ollama
        valueFiles:
          - $values/platform/ai/ollama/values.yaml
    - repoURL: https://gitea.util.lcl/AduraX/util-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
