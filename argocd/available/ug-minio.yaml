apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ug-minio
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: util-gitops
    util-gitops.io/category: storage
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: ug-infra
  sources:
    - repoURL: https://charts.min.io/
      chart: minio
      targetRevision: "*"
      helm:
        releaseName: minio
        valueFiles:
          - $values/platform/storage/minio/values.yaml
    - repoURL: https://gitea.util.lcl/AduraX/util-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=false
