# ArgoCD Helm values — self-managed by ArgoCD
# Chart: argo/argo-cd

global:
  networkPolicy:
    create: false

dex:
  enabled: false

repoServer:
  livenessProbe:
    timeoutSeconds: 5
    periodSeconds: 30
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5
    periodSeconds: 30
    failureThreshold: 5

controller:
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5

configs:
  params:
    server.insecure: true
  cm:
    url: https://argocd.gitops.lcl
    # Keycloak OIDC (uncomment after Keycloak is deployed)
    # oidc.config: |
    #   name: Keycloak
    #   issuer: https://keycloak.gitops.lcl/realms/master
    #   clientID: argocd-client
    #   clientSecret: $oidc.keycloak.clientSecret
    #   requestedScopes: ["openid", "profile", "email", "groups"]
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, admins, role:admin
