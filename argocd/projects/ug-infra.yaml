apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ug-infra
  namespace: argocd
spec:
  description: "util-gitops infrastructure — full cluster access for platform services"
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
