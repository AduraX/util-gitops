apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ug-forge4x
  namespace: argocd
spec:
  description: "Forge4X workloads — delegates to Forge4X deploy repo"
  sourceRepos:
    - '*'
  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
