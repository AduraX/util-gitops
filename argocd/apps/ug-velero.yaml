apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ug-velero
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: util-gitops
    util-gitops.io/category: backup
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: ug-infra
  sources:
    - repoURL: https://vmware-tanzu.github.io/helm-charts
      chart: velero
      targetRevision: "*"
      helm:
        releaseName: velero
        valueFiles:
          - $values/platform/backup/velero/values.yaml
    - repoURL: https://gitea.util.lcl/AduraX/util-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  ignoreDifferences:
    - group: ""
      kind: Service
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
